<style>
/* Layout: одна колонка до 480px; маскот Домовик веде гравця; кожна тема має свій колір; відповіді в зоні великого пальця */
/* Палітра «Кодекс 2.0»: електричний фіолет — бренд, лимон — лише нагороди, м'ята/корал — відповіді */
:root{
  --bg:#FFFFFF; --card:#F4F4FA; --line:#E4E4EF; --fg:#14142B; --muted:#5F6080;
  --accent:#6C4CF5; --accent-ink:#FFFFFF; --accent-soft:#EFEBFF;
  --good:#0CA678; --good-soft:#E3FAF2; --bad:#F0473A; --bad-soft:#FFECEA;
  --calm:#5F6B85; --calm-soft:#EEF0F6; --scrim:rgba(20,20,43,.5);
  --gold:#FFC83D; --gold-ink:#8F5B00; --tint:9%;
  --b1:#C2255C; --b2:#B8400A; --b3:#3B5BDB; --b4:#0B7285; --b5:#9C36B5;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1020; --card:#1A1B33; --line:#2A2C4A; --fg:#F2F2FA; --muted:#9C9EC0;
  --accent:#8E75FF; --accent-ink:#0F0B2E; --accent-soft:#241E4D;
  --good:#38D9A9; --good-soft:#0F2E28; --bad:#FF8577; --bad-soft:#3A1A1C;
  --calm:#A5ADC6; --calm-soft:#22243A; --scrim:rgba(0,0,0,.65);
  --gold:#FFD43B; --gold-ink:#FFD43B; --tint:12%;
  --b1:#F783AC; --b2:#FFA94D; --b3:#91A7FF; --b4:#3BC9DB; --b5:#DA77F2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1020; --card:#1A1B33; --line:#2A2C4A; --fg:#F2F2FA; --muted:#9C9EC0;
  --accent:#8E75FF; --accent-ink:#0F0B2E; --accent-soft:#241E4D;
  --good:#38D9A9; --good-soft:#0F2E28; --bad:#FF8577; --bad-soft:#3A1A1C;
  --calm:#A5ADC6; --calm-soft:#22243A; --scrim:rgba(0,0,0,.65);
  --gold:#FFD43B; --gold-ink:#FFD43B; --tint:12%;
  --b1:#F783AC; --b2:#FFA94D; --b3:#91A7FF; --b4:#3BC9DB; --b5:#DA77F2; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 24px}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.brand{font-size:13px;color:var(--muted);font-weight:500;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:12px 20px;border-radius:14px;border:0;font-weight:600;font-size:17px;transition:transform .1s,box-shadow .1s;text-decoration:none;text-align:center}
.btn:active{transform:translateY(2px)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn-primary:active{box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn-link{background:none;border:0;min-height:44px;color:var(--accent);font-weight:600;font-size:15px;padding:8px 4px;width:auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.spacer{flex:1}
.disclaimer{font-size:13px;color:var(--muted);text-align:center}

/* Маскот і репліки */
.mascot{display:block;flex:none;color:var(--fg);overflow:visible}
.bob{animation:bob 3.2s ease-in-out infinite}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.say{display:flex;align-items:flex-end;gap:10px}
.bubble{position:relative;background:var(--card);border-radius:18px 18px 18px 6px;padding:12px 14px;font-weight:500;font-size:15px;line-height:1.45;min-width:0;flex:1}
.bubble b{font-weight:700}

/* Старт */
.start-hero{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.start-title{font-size:clamp(34px,10vw,44px);font-weight:700;letter-spacing:-.02em}
.start-title .hl{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--gold) 50%,transparent) 58%);padding:0 2px}
.start-sub{font-size:17px;color:var(--muted)}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topic{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;font-weight:600;color:var(--bc);background:color-mix(in srgb,var(--bc) 13%,var(--bg))}
.topic svg,.qhead svg,.sit svg,.bar-row .lbl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.facts{display:flex;gap:16px;font-size:14px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.facts b{color:var(--fg);font-size:20px;display:block;line-height:1.1}

/* Вибір ситуації */
.sit-list{display:flex;flex-direction:column;gap:10px}
.sit{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:64px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);transition:border-color .15s,transform .1s}
.sit:hover{border-color:var(--bc)}
.sit:active{transform:scale(.98)}
.sit .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--bc);background:color-mix(in srgb,var(--bc) 14%,var(--bg));flex:none}
.sit .ico svg{width:22px;height:22px}
.sit b{font-weight:600;font-size:16px}

/* Питання */
.topbar{display:flex;flex-direction:column;gap:8px}
.progress{height:10px;background:var(--card);border-radius:10px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--bc);border-radius:10px;transition:width .4s cubic-bezier(.3,1.3,.5,1);position:relative}
.progress span::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:3px;border-radius:3px;background:rgba(255,255,255,.35)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.streak{display:inline-flex;align-items:center;gap:4px;color:var(--gold-ink);font-weight:700;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.streak.on{opacity:1;transform:none}
.streak svg{width:18px;height:18px;fill:var(--gold)}
.qcard{position:relative;margin-top:62px;background:color-mix(in srgb,var(--bc) var(--tint),var(--card));border:1px solid color-mix(in srgb,var(--bc) 28%,transparent);border-radius:22px;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px}
.qcard .mascot{position:absolute;right:4px;top:-66px}
.qcard .mine{align-self:flex-start}
.qhead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--bc);padding-right:0}
.qtype{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--bg);background:var(--bc);padding:4px 10px;border-radius:999px}
.situation{font-size:clamp(20px,calc(1.6vh + 8px),26px);font-weight:600;line-height:1.35}
.answers{display:flex;flex-direction:column;gap:10px}
.answers.pair{flex-direction:row}
.answers.pair .ans{justify-content:center;text-align:center;font-weight:700;font-size:18px}
.ans{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);text-align:left;font-size:16px;font-weight:500;box-shadow:0 3px 0 var(--line);transition:background .15s,border-color .15s,opacity .2s,transform .1s,box-shadow .1s}
.ans:hover:not([disabled]){border-color:var(--bc)}
.ans:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.let{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--card);color:var(--muted);transition:background .15s,color .15s}
.ans .ic{flex:none;width:22px;height:22px;display:none;margin-left:auto;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ans.right{background:var(--good-soft);border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.ans.right .let{background:var(--good);color:var(--bg)}
.ans.right .ic-ok{display:block;stroke:var(--good)}
.ans.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.ans.wrong .let{background:var(--bad);color:var(--bg)}
.ans.wrong .ic-no{display:block;stroke:var(--bad)}
.ans.calm{background:var(--calm-soft);border-color:var(--calm);box-shadow:0 3px 0 var(--calm)}
.ans.dim{opacity:.4}
.ans[disabled]{cursor:default}
.ans.picked.right{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.ans.picked.wrong{animation:shake .4s}

/* Пояснення знизу */
.explain{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,1.1,.4,1);pointer-events:none}
.explain.open{transform:none;pointer-events:auto}
.explain-in{width:100%;max-width:480px;margin-left:max(0px,env(safe-area-inset-left,0px));margin-right:max(0px,env(safe-area-inset-right,0px));
  background:var(--card);border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) 0;box-shadow:0 -10px 36px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--vc)}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--vc)}
.norm{font-family:var(--mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;align-self:flex-start;color:var(--fg)}
button.norm{text-decoration:underline dotted;text-underline-offset:3px}
.ex-actions{display:flex;gap:10px;align-items:center;padding-bottom:4px}
.ex-actions .btn-primary{flex:1}
.help{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.help b{font-size:15px}
.help .num{font-family:var(--mono);font-size:16px;color:var(--fg);user-select:all;font-weight:500}

/* Шторка «Детальніше» */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;max-height:85%;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,1.1,.4,1)}
.sheet-wrap.open .sheet{transform:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 16px 8px}
.sheet-head .t{display:flex;align-items:center;gap:10px}
.sheet-head h3{font-size:18px}
.sheet-close{width:44px;height:44px;border-radius:12px;border:0;background:var(--card);font-size:22px;line-height:1;flex:none}
.sheet-body{overflow-y:auto;padding:0 16px 8px;display:flex;flex-direction:column;gap:14px}
.sheet-body p{line-height:1.65}
.sheet-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

/* Пауза */
.cheer{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;text-align:center}
.cheer .big{font-size:26px;font-weight:700;line-height:1.25}

/* Фінал */
.final-top{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:4px}
.score{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.arch{font-size:30px;font-weight:700;letter-spacing:-.01em}
.final-top .bubble{border-radius:18px;text-align:left}
.bars{display:flex;flex-direction:column;gap:14px;background:var(--card);border-radius:20px;padding:16px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.bar-row .lbl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;min-width:0;color:var(--fg)}
.bar-row .lbl svg{color:var(--bc)}
.bar-row .val{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:10px;background:var(--bg);border-radius:10px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:10px;background:var(--bc);transform-origin:left;animation:grow .8s cubic-bezier(.3,1.2,.5,1) both}
.bar-row.blind .lbl{color:var(--bad)}
.tag-blind{white-space:nowrap;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--bg);background:var(--bad);border-radius:999px;padding:2px 8px}
.blind-card{border:1.5px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.blind-card h3{font-size:20px}
details.review{border:1.5px solid var(--line);border-radius:20px;padding:4px 16px}
details.review summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.rev-item{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rev-item .q{font-weight:600}
.story-wrap{display:flex;flex-direction:column;gap:10px}
.story{aspect-ratio:9/16;max-width:220px;width:62%;align-self:center;border-radius:20px;background:linear-gradient(160deg,#6C4CF5 0%,#8E3BD6 55%,#D6336C 100%);color:#fff;padding:20px 16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;overflow:hidden}
.story .s-k{font-family:var(--mono);font-size:10px;opacity:.9}
.story .s-a{font-size:21px;font-weight:700;line-height:1.15}
.story .s-q{font-size:14px;font-weight:600;line-height:1.3}

.row2{display:flex;gap:10px}
.row2 .btn{flex:1;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.pad-bottom{height:0;transition:height .25s;flex:none}
.qhead .qt{color:var(--muted);font-weight:500}
.mine{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 7px;white-space:nowrap}
.mine svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.lawlink{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:40px;padding:8px 12px;border-radius:10px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;text-align:left}
.lawlink svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.verdict .mascot{margin:-10px 0 -6px -4px}
.score-big{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.score-big small{font-size:22px;color:var(--muted);font-weight:600}
.sit-note{font-size:14px;color:var(--muted)}
.judge-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;border-radius:28px;padding:32px 20px;color:#FFFFFF;background:radial-gradient(circle at 50% 40%,#4A33C7 0%,#22195F 38%,#0F1020 72%);position:relative;overflow:hidden}
.judge-stage::before{content:"";position:absolute;left:50%;top:-10%;width:70%;height:80%;transform:translateX(-50%);background:radial-gradient(ellipse at top,rgba(255,200,61,.22),transparent 70%);pointer-events:none}
.judge-stage .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#FFC83D;position:relative}
.judge-stage .big{font-size:24px;font-weight:700;line-height:1.25;max-width:320px;position:relative}
.judge-stage .mascot{color:#FFFFFF;position:relative}
.gavel{transform-box:view-box;transform-origin:104px 80px;transform:rotate(20deg)}
.striking .gavel{animation:strike .55s cubic-bezier(.5,0,.75,0) 3}
.spark{opacity:0}
.striking .spark{animation:spark .55s 3}
.verdict-label{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 12px}
@keyframes strike{0%{transform:rotate(20deg)}30%{transform:rotate(-12deg)}55%{transform:rotate(84deg)}68%{transform:rotate(76deg)}100%{transform:rotate(20deg)}}
@keyframes spark{0%,50%{opacity:0}56%{opacity:1}85%,100%{opacity:0}}
.segs{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.seg{height:8px;border-radius:4px;background:var(--line);transition:background .25s}
.seg.ok{background:var(--good)} .seg.no{background:var(--bad)} .seg.calm{background:var(--calm)} .seg.now{background:var(--accent)}
.facts-line{font-size:15px;color:var(--muted);font-weight:500}
.facts-line b{color:var(--fg);font-weight:700}
.teaser{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.teaser .k{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.teaser p{font-weight:600;font-size:17px;line-height:1.35}
.teaser .hint{font-size:13px;color:var(--muted);font-weight:500}
.judge-stage{isolation:isolate}
.judge-stage .striking{position:relative;display:block}
.judge-stage .striking::before{content:"";position:absolute;inset:-6% -8%;background:radial-gradient(circle at 42% 52%,rgba(255,244,214,.75),rgba(255,214,120,.25) 38%,rgba(255,255,255,0) 64%);z-index:-1}

const QUESTIONS = [
  {"id": "2.1", "block": 2, "type": "Ситуація", "diff": 2, "trap": true, "situation": "Бабуся подарувала дружині квартиру під час шлюбу. Пара розлучається. Як поділять квартиру?", "options": ["Навпіл — набута ж у шлюбі", "Квартира залишиться дружині", "Чоловікові дістанеться третина", "Як вирішить суд на власний розсуд"], "correct": 1, "short": "Подароване чи успадковане в шлюбі — особиста власність того, кому воно дісталося. Ділити його між подружжям не потрібно.", "full": "Відповідно до п. 2 ч. 1 ст. 57 СК України майно, набуте одним із подружжя за час шлюбу на підставі договору дарування або в порядку спадкування, є його особистою приватною власністю і поділу між подружжям не підлягає. Виняток: якщо вартість такого майна істотно збільшилася внаслідок спільних трудових чи грошових затрат або затрат другого з подружжя, суд може визнати його об'єктом спільної сумісної власності (ч. 1 ст. 62 СК України).", "norm": "п. 2 ч. 1 ст. 57, ч. 1 ст. 62 СК України", "cta": "Довести, що майно моє особисте"},
  {"id": "1.1", "block": 1, "type": "Цифра", "diff": 1, "situation": "З якого віку можна одружитися без рішення суду?", "options": ["16 років", "17 років", "18 років", "21 рік"], "correct": 2, "short": "Одружитися можна з 18 років. З 16 — лише якщо суд вирішить, що це відповідає інтересам людини.", "full": "Відповідно до ч. 1 ст. 22 СК України шлюбний вік для жінок і чоловіків становить вісімнадцять років. За заявою особи, яка досягла шістнадцяти років, суд може надати їй право на шлюб, якщо це відповідає її інтересам (ч. 2 ст. 23 СК України).", "norm": "ч. 1 ст. 22, ч. 2 ст. 23 СК України", "cta": "Консультація перед весіллям"},

  {"id": "3.1", "block": 3, "type": "Правда чи міф", "diff": 2, "trap": true, "situation": "«Через 3 роки після розлучення поділити спільне майно вже не можна».", "options": ["Правда", "Міф"], "correct": 1, "short": "Міф. Три роки на поділ майна рахують не від розлучення, а від дня, коли дізналися або могли дізнатися про порушення свого права на майно. Поки шлюб триває, строк узагалі не спливає.", "full": "Розірвання шлюбу не припиняє права спільної сумісної власності на майно, набуте за час шлюбу (ч. 1 ст. 68 СК України). До вимоги про поділ майна подружжя, яке перебуває у шлюбі, позовна давність не застосовується (ч. 1 ст. 72 СК України). До вимоги про поділ майна, заявленої після розірвання шлюбу, застосовується позовна давність у три роки, яка обчислюється від дня, коли один зі співвласників дізнався або міг дізнатися про порушення свого права власності, а не від дня розірвання шлюбу (ч. 2 ст. 72 СК України).", "norm": "ч. 1 ст. 68, ч. 1, 2 ст. 72 СК України", "cta": "Перевірити, чи не сплив мій строк"},

  {"id": "3.3", "block": 3, "type": "Що вирішить суд", "diff": 2, "sensitive": true, "help": true, "situation": "Дружина подала на розлучення. Чоловік проти й просить суд дати час на примирення. Відомо, що він вчинив домашнє насильство. Що зробить суд?", "options": ["Дасть строк на примирення", "Не вживатиме заходів примирення", "Дасть строк, лише якщо дружина погодиться", "Чекатиме вироку у кримінальній справі"], "correct": 1, "short": "Якщо один із подружжя вчинив домашнє насильство, суд не дає строку на примирення.", "full": "Відповідно до ч. 2 ст. 111 СК України, якщо один із подружжя вчинив домашнє насильство, заходи щодо примирення подружжя не вживаються незалежно від стану розгляду кримінального провадження, цивільної справи або справи про адміністративне правопорушення щодо домашнього насильства. Норму запроваджено Законом № 4073-IX від 20.11.2024.", "norm": "ч. 2 ст. 111 СК України", "cta": "Отримати правову допомогу"},
  {"id": "3.4", "block": 3, "type": "Ситуація", "diff": 2, "situation": "Чоловік заробляв утричі більше за дружину. Як поділять спільне майно при розлученні?", "options": ["Пропорційно доходам", "Навпіл, якщо немає особливих обставин", "Дві третини — чоловікові", "Як суд вирішить на власний розсуд"], "correct": 1, "short": "Спільне майно ділять навпіл, хто би скільки не заробляв. Від рівних часток суд відступає лише за особливих обставин.", "full": "Відповідно до ч. 1 ст. 70 СК України частки подружжя у спільному майні є рівними, якщо інше не визначено домовленістю між ними або шлюбним договором; різниця в доходах на розмір часток не впливає. Суд може відступити від засади рівності, зокрема якщо один із подружжя ухилявся від участі в утриманні дитини, приховав, знищив чи пошкодив спільне майно (ч. 2 ст. 70), а за певних умов — збільшити частку того, з ким проживають діти (ч. 3 ст. 70 СК України).", "norm": "ч. 1–3 ст. 70 СК України", "cta": "Захистити свою частку майна"},
  {"id": "1.3", "block": 1, "type": "Правда чи міф", "diff": 2, "situation": "«Якщо пара жила разом без розпису, на спільно куплене майно прав немає».", "options": ["Правда", "Міф"], "correct": 1, "short": "Міф. Прав подружжя пара без шлюбу не має, але майно, набуте разом, — спільне, якщо ніхто з пари не був у іншому шлюбі. Факт спільного проживання доведеться довести.", "full": "Проживання однією сім'єю без шлюбу не є підставою для виникнення прав та обов'язків подружжя (ч. 2 ст. 21 СК України). Проте майно, набуте за час спільного проживання жінкою та чоловіком, які не перебувають у шлюбі між собою або в будь-якому іншому шлюбі, належить їм на праві спільної сумісної власності, якщо інше не встановлено письмовим договором між ними (ч. 1 ст. 74 СК України). Факт проживання однією сім'єю підлягає доведенню, як правило, у справі про встановлення цього факту.", "norm": "ч. 2 ст. 21, ч. 1 ст. 74 СК України", "cta": "Довести право на майно без шлюбу"},
  {"id": "5.1", "block": 5, "type": "Ситуація", "diff": 2, "situation": "Батьки живуть окремо. 15-річний син хоче жити з татом, мама проти. Хто вирішує?", "options": ["Батьки разом", "Суд", "Сам син", "Служба у справах дітей"], "correct": 2, "short": "Коли батьки живуть окремо, дитина з 14 років сама обирає, з ким із них жити.", "full": "Згідно з ч. 3 ст. 160 СК України, якщо батьки проживають окремо, місце проживання дитини, яка досягла чотирнадцяти років, визначається нею самою. Місце проживання дитини віком від десяти до чотирнадцяти років визначається за спільною згодою батьків та самої дитини (ч. 2 ст. 160 СК України).", "norm": "ч. 2, 3 ст. 160 СК України", "cta": "Визначити, з ким житиме дитина"},
  {"id": "5.2", "block": 5, "type": "Ситуація", "diff": 2, "trap": true, "sensitive": true, "situation": "Батька позбавили батьківських прав. Чи має він далі платити аліменти?", "options": ["Ні — немає прав, немає й обов'язків", "Так", "Лише якщо мама попросить", "Лише до 14 років дитини"], "correct": 1, "short": "Так. Позбавлення батьківських прав не звільняє від аліментів — суд стягує їх у тому самому рішенні.", "full": "Відповідно до ч. 2 ст. 166 СК України особа, позбавлена батьківських прав, не звільняється від обов'язку щодо утримання дитини. Задовольняючи позов про позбавлення батьківських прав, суд одночасно приймає рішення про стягнення аліментів на дитину (ч. 3 ст. 166 СК України).", "norm": "ч. 2, 3 ст. 166 СК України", "cta": "Стягнути аліменти на мою дитину"},
  {"id": "4.1", "block": 4, "type": "Цифра", "diff": 2, "situation": "Найменші аліменти на одну дитину за законом — не менше ніж…", "options": ["25% прожиткового мінімуму", "50% прожиткового мінімуму для дитини відповідного віку", "100% прожиткового мінімуму", "Чверть зарплати платника"], "correct": 1, "short": "Мінімум — половина прожиткового мінімуму для дитини відповідного віку. Рекомендований розмір — повний прожитковий мінімум, якщо дохід платника дозволяє.", "full": "Згідно з абз. 2 ч. 2 ст. 182 СК України мінімальний гарантований розмір аліментів на одну дитину не може бути меншим, ніж 50 відсотків прожиткового мінімуму для дитини відповідного віку. Мінімальний рекомендований розмір становить прожитковий мінімум для дитини відповідного віку і може бути присуджений судом у разі достатності заробітку (доходу) платника (абз. 3 ч. 2 ст. 182 СК України).", "norm": "абз. 2, 3 ч. 2 ст. 182 СК України", "cta": "Дізнатися розмір аліментів для моєї дитини"},
  {"id": "4.2", "block": 4, "type": "Цифра", "diff": 2, "situation": "Тато з власної вини прострочив аліменти. Яку неустойку (пеню) можна стягнути?", "options": ["Жодної — лише сам борг", "3% річних", "1% боргу за кожен день, але не більше 100% боргу", "0,1% за кожен день без обмежень"], "correct": 2, "short": "За кожен день прострочення — 1% боргу, але загалом неустойка не може перевищити суму самого боргу.", "full": "Відповідно до ч. 1 ст. 196 СК України в разі виникнення заборгованості з вини платника одержувач аліментів має право на стягнення неустойки (пені) в розмірі одного відсотка суми несплачених аліментів за кожен день прострочення, але не більше 100 відсотків заборгованості. Суд може зменшити розмір неустойки з урахуванням матеріального та сімейного стану платника (ч. 2), а неповнолітній платник її не сплачує (ч. 3 ст. 196 СК України).", "norm": "ч. 1–3 ст. 196 СК України", "cta": "Стягнути борг і неустойку з аліментів"},
  {"id": "4.3", "block": 4, "type": "Що вирішить суд", "diff": 3, "situation": "Мама 4 роки не подавала на аліменти — тато обіцяв платити сам, але не платив. Вимог вона не надсилала. Тепер просить стягнути аліменти і за ці 4 роки. Що вирішить суд?", "options": ["Стягне за всі 4 роки", "Стягне лише від дня подання позову", "Стягне за 3 роки — це позовна давність", "Стягне за 10 років назад"], "correct": 1, "short": "Аліменти рахують від дня позову. За минулі роки — лише якщо доведено, що їх вимагали, а платник ухилявся.", "full": "За ч. 1 ст. 191 СК України аліменти на дитину присуджуються від дня пред'явлення позову. Аліменти за минулий час, але не більш як за десять років, суд може присудити лише за умови, що позивач доведе вжиття заходів щодо їх одержання та ухилення відповідача від сплати (ч. 2 ст. 191 СК України). Усні домовленості без підтверджених вимог (листів, повідомлень у месенджерах, звернень) таким доказом, як правило, не визнаються.", "norm": "ч. 1, 2 ст. 191 СК України", "cta": "Стягнути аліменти на мою дитину"},
  {"id": "1.4", "block": 1, "type": "Ситуація", "diff": 3, "situation": "Дружина працює, живе окремо від чоловіка з їхньою 2-річною дитиною. Чи має вона право на утримання від нього — для себе, а не лише на дитину?", "options": ["Ні, бо вона працює", "Так, якщо чоловік фінансово може допомагати", "Лише якщо вона не має доходу", "Лише до року дитини"], "correct": 1, "short": "Так. Дружина, з якою живе дитина до 3 років, має право на утримання від чоловіка — батька дитини, навіть якщо працює. Умова одна: він може допомагати. Після розлучення право зберігається.", "full": "Відповідно до ч. 2 ст. 84 СК України дружина, з якою проживає дитина, має право на утримання від чоловіка — батька дитини до досягнення дитиною трьох років. Це право не залежить від її працездатності та матеріального становища, за умови, що чоловік може надавати матеріальну допомогу (ч. 4 ст. 84), і зберігається в разі розірвання шлюбу (ч. 6 ст. 84). Аналогічне право має чоловік, з яким проживає дитина (ст. 86 СК України).", "norm": "ч. 2, 4, 6 ст. 84; ст. 86 СК України", "cta": "Оцінити моє право на утримання"},
  {"id": "4.4", "block": 4, "type": "Ситуація", "diff": 3, "situation": "Суд визначив, що дитина живе з мамою. Мама хоче везти її на 2 тижні на море за кордон. Тато аліменти платить і з дитиною спілкується. Чи потрібна його згода?", "options": ["Так, нотаріально посвідчена", "Ні, але тата треба повідомити рекомендованим листом", "Ні, взагалі нічого робити не треба", "Так, і ще дозвіл суду"], "correct": 1, "short": "Згода тата не потрібна. Але про поїздку його треба повідомити рекомендованим листом: мета, країна і строк.", "full": "Відповідно до абз. 1 ч. 5 ст. 157 СК України той із батьків, з яким місце проживання дитини визначено рішенням суду або підтверджено висновком органу опіки та піклування, самостійно вирішує питання тимчасового виїзду дитини за межі України на строк до одного місяця, зокрема з метою оздоровлення та відпочинку. Якщо другий із батьків належно виконує батьківські обов'язки, його необхідно повідомити рекомендованим листом про мету виїзду, державу прямування та строк перебування. Під час воєнного стану згода другого з батьків на виїзд дитини за кордон не вимагається відповідно до Правил перетинання державного кордону громадянами України, затверджених постановою Кабінету Міністрів України від 27.01.1995 № 57; обов'язок повідомлення за ч. 5 ст. 157 СК України при цьому зберігається.", "norm": "абз. 1 ч. 5 ст. 157 СК України; Правила перетинання державного кордону громадянами України (постанова КМУ від 27.01.1995 № 57)", "cta": "Підготувати виїзд дитини за кордон"},
  {"id": "5.3", "block": 5, "type": "Що вирішить суд", "diff": 3, "situation": "Батько роками не платив аліменти — борг більший, ніж платежі за 3 роки, і досі не погашений. Тепер він непрацездатний і вимагає утримання від дорослого сина. Що вирішить суд?", "options": ["Зобов'яже сина платити", "Звільнить сина від утримання", "Зменшить аліменти вдвічі", "Стягне аліменти, але не більше 3 років"], "correct": 1, "short": "Суд звільняє дорослу дитину від утримання батька, який має непогашений борг з аліментів понад три роки платежів.", "full": "Відповідно до абз. 2 ч. 1 ст. 204 СК України суд звільняє дочку, сина від обов'язку утримувати матір, батька, якщо ті не сплачували аліменти на утримання дитини і мають непогашену на момент ухвалення рішення заборгованість, сукупний розмір якої перевищує суму платежів за три роки. Наявність такої заборгованості підтверджується довідкою органу державної виконавчої служби або приватного виконавця (ч. 2 ст. 204 СК України).", "norm": "абз. 2 ч. 1, ч. 2 ст. 204 СК України", "cta": "Захиститися від позову про утримання"},
  {"id": "5.4", "block": 5, "type": "Ситуація", "diff": 1, "situation": "Після розлучення мама не дає бабусі по татові бачитися з онуком. Чи має бабуся якісь права?", "options": ["Ні — вона не батько і не мати", "Так, може звернутися до суду", "Лише з дозволу мами", "Лише якщо тато живе з дитиною"], "correct": 1, "short": "Бабусі й дідусі мають право спілкуватися з онуками. Якщо батьки заважають, порядок спілкування може визначити суд.", "full": "Відповідно до ч. 1 ст. 257 СК України баба, дід, прабаба, прадід мають право спілкуватися зі своїми внуками, правнуками та брати участь у їх вихованні. Батьки чи інші особи, з якими проживає дитина, не мають права перешкоджати цьому; якщо такі перешкоди чиняться, баба, дід, прабаба, прадід мають право звернутися до суду з позовом про їх усунення (ч. 2 ст. 257 СК України).", "norm": "ч. 1, 2 ст. 257 СК України", "cta": "Захистити право на спілкування з онуками"},
  {"id": "1.5", "block": 1, "type": "Ситуація", "diff": 1, "situation": "Наречена вагітна. Пара хоче розписатися того ж дня, коли подає заяву. Чи можна?", "options": ["Ні, лише через місяць після заяви", "Так, у день подання заяви", "Лише з дозволу суду", "Лише через 10 днів"], "correct": 1, "short": "Так. Якщо наречена вагітна або вже народила, шлюб можуть зареєструвати в день подання заяви або будь-коли протягом місяця.", "full": "За загальним правилом шлюб реєструється після спливу одного місяця від дня подання заяви (абз. 1 ч. 1 ст. 32 СК України). Проте у разі вагітності нареченої, народження нею дитини, а також якщо є безпосередня загроза для життя нареченої або нареченого, шлюб реєструється у день подання відповідної заяви або в будь-який інший день за бажанням наречених протягом одного місяця (ч. 2 ст. 32 СК України).", "norm": "ч. 1, 2 ст. 32 СК України", "cta": "Консультація перед весіллям"},
  {"id": "1.6", "block": 1, "type": "Цифра", "diff": 1, "situation": "Наречена хоче приєднати до свого прізвища прізвище нареченого, а згодом ще й прізвище бабусі. Скільки прізвищ можна скласти?", "options": ["Скільки завгодно", "Не більше двох", "Не більше трьох", "Лише одне"], "correct": 1, "short": "Не більше двох. Виняток — якщо інше випливає зі звичаю національної меншини, до якої належить наречена чи наречений.", "full": "Наречені мають право обрати прізвище одного з них як спільне прізвище подружжя, надалі іменуватися дошлюбними прізвищами або приєднати до свого прізвища прізвище другого (ч. 1, 2 ст. 35 СК України). Складення більше двох прізвищ не допускається, якщо інше не випливає із звичаю національної меншини, до якої належить наречена і (або) наречений (абз. 2 ч. 2 ст. 35 СК України).", "norm": "ч. 1, 2 ст. 35 СК України", "cta": "Консультація перед весіллям"},
  {"id": "1.7", "block": 1, "type": "Що вирішить суд", "diff": 3, "trap": true, "situation": "За тиждень до весілля наречений передумав одружуватися. Наречена вже оплатила ресторан і сукню. Чи має він відшкодувати ці витрати?", "options": ["Ні, відмова від шлюбу — його право", "Так, якщо відмову не спричинила її неправомірна поведінка", "Лише половину витрат", "Лише якщо була письмова домовленість"], "correct": 1, "short": "Так. Той, хто відмовився від шлюбу, відшкодовує витрати на підготовку до весілля. Виняток — якщо відмову спричинила протиправна чи аморальна поведінка іншої сторони або приховування важливих обставин.", "full": "Відповідно до абз. 1 ч. 3 ст. 31 СК України особа, яка відмовилася від шлюбу, зобов'язана відшкодувати другій стороні затрати, що були нею понесені у зв'язку з приготуванням до реєстрації шлюбу та весілля. Такі затрати не підлягають відшкодуванню, якщо відмова від шлюбу була викликана протиправною, аморальною поведінкою нареченої, нареченого або приховуванням обставин, що мають істотне значення (тяжка хвороба, наявність дитини, судимість тощо) (абз. 2 ч. 3 ст. 31 СК України). Розмір витрат підтверджують чеками, договорами, банківськими виписками.", "norm": "ч. 3 ст. 31 СК України", "cta": "Вимагати відшкодування витрат на весілля"},
  {"id": "1.8", "block": 1, "type": "Ситуація", "diff": 2, "situation": "Мама нареченого подарувала нареченій авто «на весілля». Наречена відмовилася від шлюбу. Чи можна повернути авто?", "options": ["Ні, подарунок не повертається", "Так, суд може розірвати дарування на вимогу дарувальниці", "Лише якщо авто ще не перереєстроване", "Лише за згодою нареченої"], "correct": 1, "short": "Так. Якщо подарунок зроблено у зв'язку з майбутнім шлюбом, а від шлюбу відмовилася саме та, хто отримала подарунок, дарувальник може через суд розірвати договір дарування.", "full": "Згідно з ч. 4 ст. 31 СК України у разі відмови від шлюбу особи, яка одержала подарунок у зв'язку з майбутнім шлюбом, договір дарування за вимогою дарувальника може бути розірваний судом. У разі розірвання договору особа зобов'язана повернути річ, яка була їй подарована, а якщо вона не збереглася, — відшкодувати її вартість.", "norm": "ч. 4 ст. 31 СК України", "cta": "Вимагати повернення подарунка"},
  {"id": "1.9", "block": 1, "type": "Правда чи міф", "diff": 1, "situation": "«Шлюбний договір можна укласти лише до весілля».", "options": ["Правда", "Міф"], "correct": 1, "short": "Міф. Шлюбний договір можуть укласти і наречені, і подружжя — у будь-який час під час шлюбу.", "full": "Відповідно до ч. 1 ст. 92 СК України шлюбний договір може бути укладено особами, які подали заяву про реєстрацію шлюбу, а також подружжям. Якщо договір укладено до реєстрації шлюбу, він набирає чинності у день реєстрації шлюбу, а якщо подружжям — у день його нотаріального посвідчення (ч. 1, 2 ст. 95 СК України).", "norm": "ч. 1 ст. 92, ч. 1, 2 ст. 95 СК України", "cta": "Скласти мій шлюбний договір"},
  {"id": "1.10", "block": 1, "type": "Ситуація", "diff": 1, "situation": "Подружжя склало шлюбний договір і підписало його вдома, без нотаріуса. Чи діє такий договір?", "options": ["Так, якщо підписали обоє", "Ні, потрібне нотаріальне посвідчення", "Так, якщо є двоє свідків", "Так, але лише щодо грошей"], "correct": 1, "short": "Ні. Шлюбний договір має бути письмовим і обов'язково нотаріально посвідченим.", "full": "Згідно зі ст. 94 СК України шлюбний договір укладається у письмовій формі і нотаріально посвідчується. Недодержання вимоги про нотаріальне посвідчення має наслідком нікчемність договору (ч. 1 ст. 220 Цивільного кодексу України), тож шлюбний договір, підписаний без нотаріуса, не породжує правових наслідків.", "norm": "ст. 94 СК України; ч. 1 ст. 220 ЦК України", "cta": "Скласти мій шлюбний договір"},
  {"id": "1.11", "block": 1, "type": "Ситуація", "diff": 2, "trap": true, "situation": "Наречені хочуть записати в шлюбному договорі: після розлучення дитина житиме з батьком. Чи можна?", "options": ["Так, це їхня домовленість", "Ні, шлюбний договір не регулює особисті відносини з дітьми", "Так, якщо погодить орган опіки", "Так, але лише до 14 років дитини"], "correct": 1, "short": "Ні. Шлюбний договір регулює лише майнові відносини. З ким житиме дитина, батьки можуть домовитися окремим договором або вирішити в суді.", "full": "Шлюбним договором регулюються майнові відносини між подружжям (ч. 1 ст. 93 СК України). Він не може регулювати особисті відносини подружжя, а також особисті відносини між ними та дітьми (ч. 3 ст. 93), не може зменшувати обсягу прав дитини, встановлених цим Кодексом, а також ставити одного з подружжя у надзвичайно невигідне матеріальне становище (ч. 4 ст. 93 СК України). Місце проживання дитини батьки визначають за домовленістю, зокрема в договорі при розірванні шлюбу (ч. 1 ст. 109 СК), а за відсутності згоди — орган опіки та піклування або суд (ст. 161 СК України).", "norm": "ч. 1, 3, 4 ст. 93; ст. 161 СК України", "cta": "Скласти мій шлюбний договір"},
  {"id": "1.12", "block": 1, "type": "Ситуація", "diff": 2, "situation": "Чоловік зареєстрував новий шлюб, не розірвавши попередній. Що з новим шлюбом?", "options": ["Він дійсний, бо зареєстрований", "Він недійсний", "Він дійсний, якщо нова дружина не знала", "Його треба розірвати через суд"], "correct": 1, "short": "Новий шлюб недійсний: в Україні можна одночасно перебувати лише в одному шлюбі.", "full": "Жінка та чоловік можуть одночасно перебувати лише в одному шлюбі (ч. 1 ст. 25 СК України). Шлюб, зареєстрований з особою, яка одночасно перебуває в іншому зареєстрованому шлюбі, є недійсним (ч. 1 ст. 39 СК України). Якщо ж попередній шлюб припинився до припинення (визнання недійсною) дії актового запису щодо повторного шлюбу, повторний шлюб стає дійсним з моменту припинення попереднього (ч. 5 ст. 39 СК України).", "norm": "ч. 1 ст. 25; ч. 1, 5 ст. 39 СК України", "cta": "Визнати шлюб недійсним"},
  {"id": "2.5", "block": 2, "type": "Ситуація", "diff": 2, "situation": "Дружина продала свою дошлюбну квартиру і за ці гроші під час шлюбу купила нову. Чия нова квартира?", "options": ["Спільна — куплена в шлюбі", "Особиста власність дружини", "Чоловікові належить половина", "Спільна, але частка дружини більша"], "correct": 1, "short": "Особиста дружини: майно, куплене в шлюбі за особисті кошти одного з подружжя, — його особиста власність. Це треба вміти довести.", "full": "Відповідно до п. 3 ч. 1 ст. 57 СК України особистою приватною власністю дружини, чоловіка є майно, набуте нею, ним за час шлюбу, але за кошти, які належали їй, йому особисто. Якщо у придбання майна вкладено, крім особистих, і спільні кошти, особистою власністю є частка, що відповідає розміру особистого внеску (ч. 7 ст. 57 СК України). Походження коштів підлягає доведенню: договорами купівлі-продажу, банківськими виписками, збігом дат і сум.", "norm": "п. 3 ч. 1, ч. 7 ст. 57 СК України", "cta": "Довести походження коштів на покупку"},
  {"id": "2.6", "block": 2, "type": "Правда чи міф", "diff": 2, "trap": true, "situation": "«Квартира, яку чоловік приватизував під час шлюбу, — спільна власність подружжя».", "options": ["Правда", "Міф"], "correct": 1, "short": "Міф. Житло, приватизоване одним із подружжя під час шлюбу, — його особиста власність. Але якщо дружина була зареєстрована в квартирі, вона зазвичай теж бере участь у приватизації й отримує власну частку.", "full": "Згідно з п. 4 ч. 1 ст. 57 СК України особистою приватною власністю дружини, чоловіка є житло, набуте нею, ним за час шлюбу внаслідок його приватизації відповідно до Закону України «Про приватизацію державного житлового фонду». Так само особистою є земельна ділянка, набута за час шлюбу внаслідок безоплатної приватизації (п. 5 ч. 1 ст. 57 СК України). Якщо в приватизації брали участь обидва з подружжя (наприклад, обоє були зареєстровані в квартирі), кожен отримує свою частку як співвласник за законом про приватизацію, а не як дружина чи чоловік.", "norm": "п. 4, 5 ч. 1 ст. 57 СК України", "cta": "Перевірити статус приватизованого житла"},
  {"id": "2.7", "block": 2, "type": "Ситуація", "diff": 2, "trap": true, "situation": "На річницю чоловік купив дружині золоті прикраси за спільні гроші. Як їх поділять при розлученні?", "options": ["Навпіл — куплені за спільні кошти", "Вони залишаться дружині", "Чоловік може забрати їх назад", "Їх продадуть, а гроші поділять"], "correct": 1, "short": "Як правило, прикраси залишаться дружині: речі індивідуального користування, зокрема коштовності, — особисті, навіть якщо куплені за спільні гроші.", "full": "Відповідно до ч. 2 ст. 57 СК України особистою приватною власністю дружини та чоловіка є речі індивідуального користування, в тому числі коштовності, навіть тоді, коли вони були придбані за рахунок спільних коштів подружжя. Тому такі речі не включаються до спільного майна, що підлягає поділу. Виняток у практиці: якщо коштовності купували не для носіння, а як вкладення коштів (злитки, інвестиційні монети, дорогі вироби, яких ніхто не носив), суд може визнати їх спільними.", "norm": "ч. 2 ст. 57 СК України", "cta": "Визначити, що не ділиться при розлученні"},
  {"id": "2.8", "block": 2, "type": "Що вирішить суд", "diff": 3, "situation": "Подружжя три роки живе окремо, але не розлучилося. За цей час чоловік купив авто. Що вирішить суд при поділі?", "options": ["Авто точно спільне — шлюб не розірвано", "Може визнати авто особистою власністю чоловіка", "Поділить авто навпіл без винятків", "Віддасть авто дружині"], "correct": 1, "short": "Суд може визнати особистим майно, набуте під час окремого проживання через фактичне припинення шлюбних відносин.", "full": "Згідно з ч. 6 ст. 57 СК України суд може визнати особистою приватною власністю дружини, чоловіка майно, набуте нею, ним за час їхнього окремого проживання у зв'язку з фактичним припиненням шлюбних відносин. Факт окремого проживання та припинення шлюбних відносин підлягає доведенню в суді: показаннями свідків, довідками про місце проживання, листуванням.", "norm": "ч. 6 ст. 57 СК України", "cta": "Довести окреме проживання"},
  {"id": "2.9", "block": 2, "type": "Правда чи міф", "diff": 1, "situation": "«Поділити спільне майно можна лише після розлучення».", "options": ["Правда", "Міф"], "correct": 1, "short": "Міф. Подружжя може поділити майно й під час шлюбу. Договір про поділ нерухомості посвідчує нотаріус.", "full": "Відповідно до ч. 1 ст. 69 СК України дружина і чоловік мають право на поділ майна, що належить їм на праві спільної сумісної власності, незалежно від розірвання шлюбу. Вони мають право розділити майно за взаємною згодою; договір про поділ житлового будинку, квартири, іншого нерухомого майна має бути нотаріально посвідчений (ч. 2 ст. 69 СК України).", "norm": "ч. 1, 2 ст. 69 СК України", "cta": "Оформити поділ майна"},
  {"id": "2.10", "block": 2, "type": "Ситуація", "diff": 3, "situation": "Чоловік без відома дружини взяв кредит на свій бізнес і не платить. Чи можуть звернути стягнення на їхню спільну квартиру?", "options": ["Так, на всю квартиру", "Лише на його виділену частку, якщо борг не в інтересах сім'ї", "Ні, ніколи", "Лише якщо дружина підписала договір"], "correct": 1, "short": "За особистими боргами одного з подружжя стягують лише його особисте майно й виділену частку. На спільне — якщо кредит узяли в інтересах сім'ї. Пастка: доходи від бізнесу, витрачені на родину, суди часто так і оцінюють.", "full": "Згідно з ч. 1 ст. 73 СК України за зобов'язаннями одного з подружжя стягнення може бути накладено лише на його особисте майно і на частку у праві спільної сумісної власності подружжя, яка виділена йому в натурі. Стягнення може бути накладено на спільне майно, якщо судом встановлено, що договір був укладений одним із подружжя в інтересах сім'ї і те, що було одержане за договором, використано на її потреби (ч. 2 ст. 73 СК України). Кредит на підприємницьку діяльність суди нерідко визнають укладеним в інтересах сім'ї, якщо доходи від бізнесу йшли на утримання родини, тож результат залежить від доказів.", "norm": "ч. 1, 2 ст. 73 СК України", "cta": "Захистити спільне майно від боргів чоловіка (дружини)"},
  {"id": "2.11", "block": 2, "type": "Ситуація", "diff": 2, "situation": "Дружина-фотограф купила в шлюбі дорогу камеру для роботи. Що з камерою при розлученні?", "options": ["Камера — її особиста річ", "Спільна, але дістанеться дружині з урахуванням вартості", "Камеру продадуть", "Камера дістанеться чоловікові"], "correct": 1, "short": "Речі для професійних занять, куплені в шлюбі, — спільні. При поділі їх отримує той, хто ними працював, а вартість враховують.", "full": "Речі для професійних занять (музичні інструменти, оргтехніка, лікарське обладнання тощо), придбані за час шлюбу для одного з подружжя, є об'єктом права спільної сумісної власності подружжя (ч. 4 ст. 61 СК України). При поділі вони присуджуються тому з подружжя, хто використовував їх у своїй професійній діяльності, а їхня вартість враховується при присудженні іншого майна другому з подружжя (ч. 3 ст. 71 СК України).", "norm": "ч. 4 ст. 61, ч. 3 ст. 71 СК України", "cta": "Підготуватися до поділу майна"},
  {"id": "2.12", "block": 2, "type": "Що вирішить суд", "diff": 3, "situation": "Чоловік хоче залишити собі спільну квартиру, а дружині виплатити компенсацію. Вона проти. Що вирішить суд?", "options": ["Присудить квартиру чоловікові з компенсацією", "Як правило, не присудить компенсацію без згоди дружини", "Продасть квартиру з торгів", "Віддасть квартиру тому, хто більше платив"], "correct": 1, "short": "Компенсацію замість частки в квартирі присуджують, як правило, лише за згодою того, хто її отримує, і після внесення грошей на депозит суду. Без згоди — лише у винятках, наприклад якщо частка незначна і її неможливо виділити.", "full": "Відповідно до ч. 4 ст. 71 СК України присудження одному з подружжя грошової компенсації замість його частки у праві спільної сумісної власності на майно, зокрема на житловий будинок, квартиру, земельну ділянку, допускається лише за його згодою, крім випадків, передбачених Цивільним кодексом України. Такі випадки встановлює ст. 365 ЦК України: частка незначна, не може бути виділена в натурі, співвласник не має істотного інтересу в спільному майні, а припинення його права не завдасть істотної шкоди йому та його сім'ї. Присудження компенсації можливе за умови попереднього внесення другим із подружжя відповідної грошової суми на депозитний рахунок суду (ч. 5 ст. 71 СК України).", "norm": "ч. 4, 5 ст. 71 СК України; ст. 365 ЦК України", "cta": "Обговорити поділ квартири"},
  {"id": "3.5", "block": 3, "type": "Правда чи міф", "diff": 2, "trap": true, "situation": "«Чоловік не може подати на розлучення, поки дружина вагітна або дитині не виповнився рік».", "options": ["Правда", "Міф"], "correct": 1, "short": "Міф. Цю заборону скасовано наприкінці 2024 року — тепер позов про розлучення може подати будь-хто з подружжя.", "full": "Раніше частина друга статті 110 СК України забороняла пред'являти позов про розірвання шлюбу протягом вагітності дружини та протягом одного року після народження дитини. Законом № 4073-IX від 20.11.2024 частини другу — четверту статті 110 СК України виключено. Чинна ч. 1 ст. 110 СК України встановлює, що позов про розірвання шлюбу може бути пред'явлений одним із подружжя.", "norm": "ч. 1 ст. 110 СК України (у ред. Закону № 4073-IX від 20.11.2024)", "cta": "Захистити свої інтереси при розлученні"},
  {"id": "3.6", "block": 3, "type": "Цифра", "diff": 1, "situation": "Подружжя без спільних неповнолітніх дітей подало заяву про розлучення до відділу ДРАЦС (РАЦС). Через який час шлюб розірвуть?", "options": ["Того ж дня", "Через місяць, якщо заяву не відкликали", "Через три місяці", "Через рік"], "correct": 1, "short": "Через місяць від дня подання заяви, якщо за цей час її ніхто не відкликав. Так само й через «Дію».", "full": "Відповідно до ч. 2 ст. 106 СК України орган державної реєстрації актів цивільного стану складає актовий запис про розірвання шлюбу після спливу одного місяця від дня подання заяви подружжям, яке не має дітей, якщо вона не була відкликана. У такому разі шлюб припиняється у день реєстрації його розірвання (ч. 1 ст. 114 СК України). Спільну заяву можна подати й онлайн через «Дію»: місячний строк зберігається, а процедура передбачає відеоконференцію з працівником ДРАЦС.", "norm": "ч. 2 ст. 106, ч. 1 ст. 114 СК України", "cta": "Обрати спосіб розлучення"},
  {"id": "3.7", "block": 3, "type": "Ситуація", "diff": 2, "situation": "Подружжя без дітей хоче розлучитися через ДРАЦС (РАЦС), але сперечається, як ділити квартиру. Чи розірвуть шлюб?", "options": ["Ні, спершу треба поділити майно", "Так, майновий спір не заважає", "Лише через суд", "Лише після оцінки квартири"], "correct": 1, "short": "Так. ДРАЦС розриває шлюб незалежно від майнового спору — майно можна поділити окремо, за домовленістю або через суд.", "full": "Згідно з ч. 3 ст. 106 СК України шлюб розривається органом державної реєстрації актів цивільного стану незалежно від наявності між подружжям майнового спору. Поділ майна може бути здійснено за взаємною згодою або за рішенням суду (ст. 69, 71 СК України).", "norm": "ч. 3 ст. 106, ст. 69, 71 СК України", "cta": "Поділити майно після розлучення"},
  {"id": "3.8", "block": 3, "type": "Ситуація", "diff": 2, "situation": "Суд ухвалив рішення про розірвання шлюбу. З якого моменту шлюб вважається припиненим?", "options": ["З дня ухвалення рішення", "З дня набрання рішенням законної сили", "З дня подання позову", "Після відмітки в ДРАЦС"], "correct": 1, "short": "У день, коли рішення суду набрало законної сили, а не в день його ухвалення.", "full": "Відповідно до ч. 2 ст. 114 СК України у разі розірвання шлюбу судом шлюб припиняється у день набрання чинності рішенням суду про розірвання шлюбу. Документом, що засвідчує факт розірвання шлюбу судом, є рішення суду про розірвання шлюбу, яке набрало законної сили (абз. 2 ч. 3 ст. 115 СК України).", "norm": "ч. 2 ст. 114, ч. 3 ст. 115 СК України", "cta": "Супровід розлучення в суді"},
  {"id": "3.9", "block": 3, "type": "Ситуація", "diff": 1, "situation": "Після розлучення колишній чоловік вимагає, щоб дружина повернула дошлюбне прізвище. Чи зобов'язана вона?", "options": ["Так, на вимогу чоловіка", "Ні, вона вирішує сама", "Так, протягом року", "Лише якщо немає дітей"], "correct": 1, "short": "Ні. Після розлучення людина сама вирішує: залишити прізвище, взяте в шлюбі, чи повернути дошлюбне.", "full": "Відповідно до ст. 113 СК України особа, яка змінила своє прізвище у зв'язку з реєстрацією шлюбу, має право після розірвання шлюбу надалі іменуватися цим прізвищем або відновити своє дошлюбне прізвище. Вибір належить лише цій особі.", "norm": "ст. 113 СК України", "cta": "Розібрати мою ситуацію з адвокатом"},
  {"id": "3.10", "block": 3, "type": "Ситуація", "diff": 3, "situation": "Подружжя не хоче розлучатися, але й жити разом не може. Суд встановив режим окремого проживання. Що це змінює?", "options": ["Шлюб припиняється", "Майно, набуте надалі, не вважатиметься спільним", "Нічого не змінює", "Припиняються всі аліменти"], "correct": 1, "short": "Шлюб триває, але майно, яке кожен набуде після встановлення режиму окремого проживання, вже не вважатиметься набутим у шлюбі.", "full": "За заявою подружжя або позовом одного з них суд може постановити рішення про встановлення режиму окремого проживання (ч. 1 ст. 119 СК України). Він не припиняє прав та обов'язків подружжя (ч. 1 ст. 120), але майно, набуте в майбутньому дружиною та чоловіком, не вважатиметься набутим у шлюбі, а дитина, народжена дружиною після спливу десяти місяців, не вважатиметься такою, що походить від її чоловіка (ч. 2 ст. 120 СК України).", "norm": "ст. 119, 120 СК України", "cta": "Оформити режим окремого проживання"},
  {"id": "3.11", "block": 3, "type": "Що вирішить суд", "diff": 3, "trap": true, "situation": "Дружина 10 років доглядала дітей і не працювала. Після розлучення вона здорова, але без доходу. Чи має право на утримання від колишнього чоловіка?", "options": ["Ні, вона працездатна", "Так, протягом трьох років, якщо він може допомагати", "Так, довічно", "Лише якщо діти живуть із нею"], "correct": 1, "short": "Так. Якщо через догляд за дітьми людина не змогла навчатися чи працювати, вона має право на утримання протягом трьох років після розлучення.", "full": "Відповідно до ч. 4 ст. 76 СК України, якщо у зв'язку з вихованням дитини, веденням домашнього господарства, піклуванням про членів сім'ї, хворобою або іншими обставинами, що мають істотне значення, один із подружжя не мав можливості одержати освіту, працювати, зайняти відповідну посаду, він має право на утримання у зв'язку з розірванням шлюбу і тоді, якщо є працездатним, за умови, що потребує матеріальної допомоги і що колишній чоловік, колишня дружина може надавати матеріальну допомогу. Право на утримання в цьому випадку триває протягом трьох років від дня розірвання шлюбу.", "norm": "ч. 4 ст. 76 СК України", "cta": "Оцінити моє право на утримання"},
  {"id": "3.12", "block": 3, "type": "Ситуація", "diff": 2, "situation": "Колишня дружина отримувала від чоловіка аліменти на себе, а тепер вийшла заміж удруге. Що з аліментами?", "options": ["Сплачуються далі", "Право на них припиняється", "Зменшуються вдвічі", "Їх сплачує новий чоловік"], "correct": 1, "short": "Право колишнього з подружжя на утримання припиняється з дня реєстрації нового шлюбу. Аліментів на дітей це не стосується.", "full": "Відповідно до ч. 1 ст. 82 СК України право одного з подружжя на утримання, а також право на утримання, яке особа має після розірвання шлюбу, припиняється у разі поновлення його працездатності, а також реєстрації з ним повторного шлюбу; право припиняється від дня настання цих обставин. Якщо стягнення аліментів за рішенням суду продовжується після цього, усі одержані суми підлягають поверненню у повному обсязі, але не більш як за три роки (ч. 2 ст. 82 СК України).", "norm": "ч. 1, 2 ст. 82 СК України", "cta": "Оцінити моє право на утримання"},
  {"id": "4.5", "block": 4, "type": "Цифра", "diff": 2, "situation": "Мама просить суд видати судовий наказ про аліменти на одну дитину у частці від доходу батька. Скільки це?", "options": ["Десята частина", "Чверть доходу", "Третина доходу", "Половина доходу"], "correct": 1, "short": "Чверть доходу на одну дитину, третина — на двох, половина — на трьох і більше, але не більше 10 прожиткових мінімумів на кожну.", "full": "Відповідно до ч. 5 ст. 183 СК України той із батьків або інших законних представників дитини, разом з яким проживає дитина, має право звернутися до суду із заявою про видачу судового наказу про стягнення аліментів у розмірі на одну дитину — однієї чверті, на двох дітей — однієї третини, на трьох і більше дітей — половини заробітку (доходу) платника аліментів, але не більше десяти прожиткових мінімумів на дитину відповідного віку на кожну дитину. Такі вимоги розглядаються в наказному провадженні (ст. 161 ЦПК України): судовий наказ видається без судового засідання, але боржник може подати заяву про його скасування.", "norm": "ч. 5 ст. 183 СК України; ст. 161 ЦПК України", "cta": "Дізнатися розмір аліментів для моєї дитини"},
  {"id": "4.6", "block": 4, "type": "Ситуація", "diff": 2, "trap": true, "situation": "Синові 19, він навчається в університеті. Чи можна стягнути з батька аліменти?", "options": ["Ні, син уже повнолітній", "Так, до 23 років, якщо батько може допомагати", "Так, довічно", "Лише до 20 років"], "correct": 1, "short": "Так. Якщо дорослі син чи донька навчаються і потребують допомоги, батьки утримують їх до 23 років, коли можуть допомагати.", "full": "Відповідно до ч. 1 ст. 199 СК України, якщо повнолітні дочка, син продовжують навчання і у зв'язку з цим потребують матеріальної допомоги, батьки зобов'язані утримувати їх до досягнення двадцяти трьох років за умови, що вони можуть надавати матеріальну допомогу. Право на утримання припиняється у разі припинення навчання (ч. 2). Право на звернення до суду має той з батьків, з ким проживає дочка, син, а також самі дочка, син (ч. 3 ст. 199 СК України).", "norm": "ст. 199 СК України", "cta": "Стягнути аліменти на мою дитину"},
  {"id": "4.7", "block": 4, "type": "Ситуація", "diff": 2, "situation": "Дитині потрібна дорога операція. Батько платить аліменти і вважає, що більше нічого не винен. Чи так це?", "options": ["Так, аліменти покривають усе", "Ні, він має брати участь у додаткових витратах", "Лише якщо суд збільшить аліменти", "Лише за його згодою"], "correct": 1, "short": "Ні. Крім аліментів, обоє батьків беруть участь у додаткових витратах на дитину — на лікування, розвиток здібностей тощо.", "full": "Відповідно до ч. 1 ст. 185 СК України той з батьків, з кого присуджено стягнення аліментів на дитину, а також той з батьків, до кого вимога про стягнення аліментів не була подана, зобов'язані брати участь у додаткових витратах на дитину, що викликані особливими обставинами (розвитком здібностей дитини, її хворобою, каліцтвом тощо). Розмір такої участі в разі спору визначає суд; додаткові витрати можуть фінансуватися наперед або покриватися після їх фактичного понесення (ч. 2 ст. 185 СК України).", "norm": "ст. 185 СК України", "cta": "Стягнути додаткові витрати на дитину"},
  {"id": "4.8", "block": 4, "type": "Правда чи міф", "diff": 1, "situation": "«Аліменти належать мамі, і вона може витрачати їх як хоче».", "options": ["Правда", "Міф"], "correct": 1, "short": "Міф. Аліменти, отримані на дитину, — власність дитини, і витрачати їх можна лише в її інтересах.", "full": "Відповідно до ч. 1 ст. 179 СК України аліменти, одержані на дитину, є власністю дитини. Той із батьків або інших законних представників дитини, на ім'я якого виплачуються аліменти, розпоряджається ними виключно за цільовим призначенням в інтересах дитини (ч. 2 ст. 179). Контроль за цільовим витрачанням аліментів здійснює орган опіки та піклування (ст. 186 СК України).", "norm": "ч. 1, 2 ст. 179; ст. 186 СК України", "cta": "Проконтролювати витрачання аліментів"},
  {"id": "4.9", "block": 4, "type": "Ситуація", "diff": 2, "situation": "Дитині виповнилося 18, а батько досі має борг з аліментів. Чи можна його стягнути?", "options": ["Ні, обов'язок уже закінчився", "Так, борг стягується і після повноліття", "Лише половину боргу", "Лише за останній рік"], "correct": 1, "short": "Так. Заборгованість за аліментами стягується незалежно від того, що дитина вже стала повнолітньою.", "full": "Відповідно до ч. 4 ст. 194 СК України заборгованість за аліментами стягується незалежно від досягнення дитиною повноліття, а у випадку, передбаченому статтею 199 цього Кодексу (утримання дитини, яка продовжує навчання), — до досягнення нею двадцяти трьох років.", "norm": "ч. 4 ст. 194 СК України", "cta": "Стягнути борг з аліментів"},
  {"id": "4.10", "block": 4, "type": "Ситуація", "diff": 2, "trap": true, "situation": "Батько запізнюється з аліментами, і мама через це забороняє йому бачитися з дитиною. Чи законно це?", "options": ["Так, поки він не погасить борг", "Ні, несплата аліментів не дає права заборонити спілкування", "Так, якщо борг більший за три місяці", "Лише з дозволу суду"], "correct": 1, "short": "Ні. Той із батьків, з ким живе дитина, не може перешкоджати спілкуванню, якщо воно не шкодить дитині. Борг стягують окремо.", "full": "Відповідно до ч. 3 ст. 157 СК України той із батьків, з ким проживає дитина, не має права перешкоджати тому з батьків, хто проживає окремо, спілкуватися з дитиною та брати участь у її вихованні, якщо таке спілкування не перешкоджає нормальному розвиткові дитини. Спори щодо участі у вихованні вирішують орган опіки та піклування або суд (ст. 158, 159 СК України), а заборгованість за аліментами стягується в окремому порядку (ст. 194–196 СК України).", "norm": "ч. 3 ст. 157; ст. 158, 159 СК України", "cta": "Визначити графік спілкування з дитиною"},
  {"id": "4.11", "block": 4, "type": "Ситуація", "diff": 1, "situation": "Хто обирає, як стягувати аліменти: у частці від доходу чи у твердій сумі?", "options": ["Суд на свій розсуд", "Той із батьків, з ким живе дитина", "Платник аліментів", "Орган опіки"], "correct": 1, "short": "Той із батьків або інший законний представник, з ким живе дитина. Спосіб стягнення згодом можна змінити через суд.", "full": "Відповідно до абз. 1 ч. 3 ст. 181 СК України за рішенням суду кошти на утримання дитини (аліменти) присуджуються у частці від доходу її матері, батька або у твердій грошовій сумі за вибором того з батьків або інших законних представників дитини, разом з яким проживає дитина. Спосіб стягнення аліментів, визначений рішенням суду, змінюється за рішенням суду за позовом одержувача аліментів (абз. 2 ч. 3 ст. 181 СК України).", "norm": "ч. 3 ст. 181 СК України", "cta": "Дізнатися розмір аліментів для моєї дитини"},
  {"id": "4.12", "block": 4, "type": "Ситуація", "diff": 3, "situation": "П'ять років тому суд присудив аліменти у твердій сумі. Відтоді ціни зросли. Чи змінюється сума?", "options": ["Ні, сума фіксована назавжди", "Так, щороку індексується", "Лише якщо платник погодиться", "Лише раз на 10 років"], "correct": 1, "short": "Так. Аліменти у твердій сумі щороку індексуються відповідно до закону, якщо батьки не домовилися про інше.", "full": "Відповідно до ч. 2 ст. 184 СК України розмір аліментів, визначений судом або домовленістю між батьками у твердій грошовій сумі, щорічно підлягає індексації відповідно до закону, якщо платник і одержувач аліментів не домовилися про інше. За заявою одержувача аліментів індексація може бути здійснена судом за інший період.", "norm": "ч. 2 ст. 184 СК України", "cta": "Проіндексувати аліменти"},
  {"id": "5.5", "block": 5, "type": "Ситуація", "diff": 2, "sensitive": true, "situation": "Батька позбавили батьківських прав. Через кілька років він змінився. Чи можна поновити права?", "options": ["Ні, позбавлення — назавжди", "Так, через суд, якщо змінилася поведінка", "Так, автоматично через 5 років", "Лише за згодою органу опіки"], "correct": 1, "short": "Так, через суд. Але поновлення неможливе, якщо дитину вже усиновили або вона стала повнолітньою.", "full": "Відповідно до ч. 1 ст. 169 СК України мати, батько, позбавлені батьківських прав, мають право на звернення до суду з позовом про поновлення батьківських прав. Суд перевіряє, наскільки змінилася поведінка особи та обставини, що були підставою для позбавлення, і постановляє рішення відповідно до інтересів дитини (ч. 4). Поновлення неможливе, якщо дитина усиновлена і усиновлення не скасоване або не визнане недійсним, а також якщо на час розгляду справи дитина досягла повноліття (ч. 2, 3 ст. 169 СК України).", "norm": "ст. 169 СК України", "cta": "Поновити мої батьківські права"},
  {"id": "5.6", "block": 5, "type": "Що вирішить суд", "diff": 3, "sensitive": true, "situation": "Маму позбавили батьківських прав. Вона просить суд дозволити побачення з дитиною. Що може вирішити суд?", "options": ["Лише відмовити — побачення заборонені", "Дозволити побачення в присутності іншої особи", "Дозволити забирати дитину на вихідні", "Повернути дитину мамі"], "correct": 1, "short": "Суд може дозволити разові чи періодичні побачення в присутності іншої особи, якщо це не зашкодить дитині.", "full": "Відповідно до ст. 168 СК України мати, батько, позбавлені батьківських прав, мають право на звернення до суду із заявою про надання їм права на побачення з дитиною. Суд може дозволити разові, періодичні побачення з дитиною, якщо це не завдасть шкоди її життю, здоров'ю та моральному вихованню, за умови присутності іншої особи.", "norm": "ст. 168 СК України", "cta": "Отримати право на побачення з дитиною"},
  {"id": "5.7", "block": 5, "type": "Ситуація", "diff": 2, "trap": true, "situation": "Чи може 15-річна дитина сама подати до суду позов про позбавлення батька батьківських прав?", "options": ["Ні, лише через маму", "Так, з 14 років", "Лише з 16 років", "Лише через адвоката"], "correct": 1, "short": "Так. Дитина, яка досягла 14 років, може сама звернутися до суду з таким позовом.", "full": "Відповідно до ст. 165 СК України право на звернення до суду з позовом про позбавлення батьківських прав мають один з батьків, опікун, піклувальник, особа, в сім'ї якої проживає дитина, заклад, у якому вона перебуває, орган опіки та піклування, прокурор, а також сама дитина, яка досягла чотирнадцяти років. Кожен учасник сімейних відносин, який досяг чотирнадцяти років, має право на безпосереднє звернення до суду (ч. 1 ст. 18 СК України).", "norm": "ст. 165, ч. 1 ст. 18 СК України", "cta": "Захистити права дитини в суді"},
  {"id": "5.8", "block": 5, "type": "Цифра", "diff": 1, "situation": "З якого віку дитина може на власний розсуд змінити прізвище та ім'я?", "options": ["З 14 років", "З 16 років", "З 18 років", "З 21 року"], "correct": 1, "short": "З 16 років — на власний розсуд, без згоди батьків. З 14 років прізвище, ім'я чи по батькові теж можна змінити, але лише за згодою батьків.", "full": "Відповідно до ч. 1 ст. 295 Цивільного кодексу України фізична особа, яка досягла шістнадцяти років, має право за власним бажанням змінити своє прізвище та (або) власне ім'я, та (або) по батькові. Особа, яка досягла чотирнадцяти років, має право змінити своє прізвище, власне ім'я, по батькові за згодою батьків або одного з них, якщо другий помер, визнаний безвісно відсутнім, недієздатним, позбавлений батьківських прав тощо (ч. 2 ст. 295 ЦК України). Зміну прізвища та по батькові дитини, молодшої за 14 років, регулюють ст. 148, 149 СК України.", "norm": "ч. 1, 2 ст. 295 ЦК України; ст. 148, 149 СК України", "cta": "Змінити прізвище чи ім'я дитини"},
  {"id": "5.9", "block": 5, "type": "Ситуація", "diff": 2, "sensitive": true, "situation": "Батька позбавили батьківських прав, і їх не поновили. На старості він вимагає утримання від сина. Чи зобов'язаний син?", "options": ["Так, діти мають утримувати батьків", "Ні, такий обов'язок не виникає", "Лише половину суми", "Лише якщо батько тяжко хворий"], "correct": 1, "short": "Ні. Якщо батька позбавили батьківських прав і не поновили, обов'язок сина утримувати його не виникає.", "full": "Відповідно до ч. 1 ст. 202 СК України повнолітні дочка, син зобов'язані утримувати батьків, які є непрацездатними і потребують матеріальної допомоги. Проте якщо мати, батько були позбавлені батьківських прав і ці права не були поновлені, обов'язок утримувати матір, батька у дочки, сина, щодо яких вони були позбавлені батьківських прав, не виникає (ч. 2 ст. 202 СК України).", "norm": "ч. 1, 2 ст. 202 СК України", "cta": "Захиститися від позову про утримання"},
  {"id": "5.10", "block": 5, "type": "Ситуація", "diff": 3, "trap": true, "situation": "Батьки дитини тяжко хворі й не можуть її утримувати. Чи можуть стягнути аліменти з бабусі?", "options": ["Ні, бабуся не батько і не мати", "Так, якщо бабуся може допомагати", "Так, у будь-якому разі", "Лише якщо дитина живе з бабусею"], "correct": 1, "short": "Так. Баба й дід зобов'язані утримувати внуків, якщо батьки з поважних причин не можуть цього робити, а самі вони мають змогу допомагати.", "full": "Відповідно до ст. 265 СК України баба, дід зобов'язані утримувати своїх малолітніх, неповнолітніх внуків, якщо у них немає матері, батька або якщо батьки не можуть з поважних причин надавати їм належного утримання, за умови, що баба, дід можуть надавати матеріальну допомогу. Розмір таких аліментів суд визначає з урахуванням матеріального та сімейного стану платника та одержувача (ч. 1 ст. 272 СК України).", "norm": "ст. 265, ч. 1 ст. 272 СК України", "cta": "Стягнути аліменти на мою дитину"},
  {"id": "5.11", "block": 5, "type": "Ситуація", "diff": 3, "situation": "Чи зобов'язаний вітчим утримувати пасинка?", "options": ["Так, завжди, якщо одружений з мамою", "Лише якщо дитина живе з ним, а рідні не можуть утримувати", "Ні, ніколи", "Лише якщо мама дитини не працює"], "correct": 1, "short": "Лише в особливих випадках: якщо дитина живе з вітчимом, а батьки, баба, дід, брати й сестри не можуть її утримувати.", "full": "Відповідно до ч. 1 ст. 268 СК України мачуха, вітчим зобов'язані утримувати малолітніх, неповнолітніх падчерку, пасинка, які з ними проживають, якщо у них немає матері, батька, діда, баби, повнолітніх братів та сестер або ці особи з поважних причин не можуть надавати їм належного утримання, за умови, що мачуха, вітчим можуть надавати матеріальну допомогу. Суд може звільнити від цього обов'язку або обмежити його строком (ч. 2 ст. 268 СК України).", "norm": "ст. 268 СК України", "cta": "Дізнатися, хто має утримувати дитину"},

const PER_BLOCK = 4, SEEN_KEY = "kviz-sk-seen";
function loadSeen(){ try { return JSON.parse(localStorage.getItem(SEEN_KEY) || "[]"); } catch(e) { return []; } }
function saveSeen(a){ try { localStorage.setItem(SEEN_KEY, JSON.stringify(a)); } catch(e) {} }
function shuffle(a){ a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/* Добір 20 питань: по 4 з кожної теми, спершу ті, яких гравець ще не бачив; порядок — крива складності */
function buildRun(){
  let seen = loadSeen(); const picked = [];
  for (const b of [1,2,3,4,5]) {
    const pool = QUESTIONS.filter(q => q.block === b);
    let fresh = pool.filter(q => !seen.includes(q.id));
    if (fresh.length < PER_BLOCK) { seen = seen.filter(id => !pool.some(q => q.id === id)); fresh = pool; }
    picked.push(...shuffle(fresh).slice(0, PER_BLOCK));
  }
  saveSeen(seen);
  const take = f => { const i = picked.findIndex(f); return i < 0 ? null : picked.splice(i, 1)[0]; };
  const opener = take(q => q.trap && q.diff <= 2 && !q.sensitive) || take(q => q.diff === 2 && !q.sensitive) || take(q => !q.sensitive);
  const closer = take(q => q.diff === 1 && !q.sensitive) || take(q => q.diff === 2 && !q.sensitive) || take(() => true);
  const easy = shuffle(picked.filter(q => q.diff === 1)), mid = picked.filter(q => q.diff === 2), hard = shuffle(picked.filter(q => q.diff === 3));
  const warm = easy.splice(0, 2);
  return [opener, ...warm, ...shuffle([...mid, ...easy]), ...hard, closer];
}

  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);

  if (S.screen === "cheer") return renderCheer();

}

function answer(k){
  const q = S.qs[S.i];
  if (S.answers[S.i] !== undefined) return;
  const ok = k === q.correct;
  S.answers[S.i] = k;
  S.streak = ok ? S.streak + 1 : 0;
  S.wrongRun = ok ? 0 : S.wrongRun + 1;
  if (!q.sensitive) sfx(ok ? "ok" : "no");
  track("quiz_answer", { q_id: q.id, q_num: S.i + 1, block: q.block, correct: ok ? 1 : 0 });
  app.querySelectorAll(".ans").forEach(b => {
    const j = +b.dataset.k; b.disabled = true;
    if (j === q.correct) b.classList.add("right");
    else if (j === k) b.classList.add(q.sensitive ? "calm" : "wrong");
    else b.classList.add("dim");
    if (j === k) b.classList.add("picked");
  });
  const mood = q.sensitive ? "calm" : ok ? (S.streak >= 3 ? "party" : "happy") : "oops";
  document.getElementById("q-mascot").innerHTML = kodyk(mood, 72, "pop");
  const seg = app.querySelector(".seg.now"); if (seg) { seg.classList.remove("now"); seg.classList.add(ok ? "ok" : q.sensitive ? "calm" : "no"); }
  const st = app.querySelector(".streak");
  st.classList.toggle("on", S.streak >= 3);
  document.getElementById("streak-n").textContent = S.streak;
  openExplain(q, ok);
}

  explainEl.innerHTML = `<div class="explain-in" style="--vc:${vc}">

    ${q.help ? `<div class="help"><b>Якщо це про тебе — допомога поруч</b><span>Національна гаряча лінія з протидії домашньому насильству (цілодобово, безкоштовно): <span class="num">15-47</span></span><span>Поліція: <span class="num">102</span></span><span>Гаряча лінія безоплатної правової допомоги: <span class="num">0 800 213 103</span></span></div>` : ""}

      <button class="btn btn-ghost" id="more" style="width:auto;flex:none;font-size:15px">Детальніше</button>
      <button class="btn btn-primary" id="next">${last ? "До результату" : "Далі"}</button>
    </div>
  </div>`;
  requestAnimationFrame(() => {
    const h = explainEl.firstElementChild.offsetHeight + 24;

    const ans = app.querySelector(".answers");

  document.getElementById("next").onclick = next;
  document.getElementById("more").onclick = () => { track("quiz_more", { q_id: q.id, via: "button" }); openSheet(q); };
  document.getElementById("norm-chip").onclick = () => { track("quiz_more", { q_id: q.id, via: "law_link" }); openSheet(q); };
  document.getElementById("next").focus({preventScroll:true});
}
function closeExplain(){ explainEl.classList.remove("open"); explainEl.innerHTML = ""; }

function next(){
  if (S.i === S.qs.length - 1) { go(reduceMotion ? "final" : "verdict"); return; }

  go("q");
}

function results(){
  const by = {}; Object.keys(BLOCKS).forEach(b => by[b] = {ok:0, all:0});
  let ok = 0;
  S.qs.forEach((q,i) => { by[q.block].all++; if (S.answers[i] === q.correct){ ok++; by[q.block].ok++; } });
  const ratios = Object.keys(by).map(b => by[b].ok / by[b].all);
  const worst = Math.min(...ratios);
  let blinds = worst < 1 ? Object.keys(by).filter(b => by[b].ok / by[b].all === worst) : [];
  const t = sit();
  if (t && t.blocks) { const m = blinds.filter(b => t.blocks.includes(+b)); if (m.length) blinds = [...m, ...blinds.filter(b => !m.includes(b))]; }
  const pct = Math.round(ok / S.qs.length * 100);
  const arch = pct >= 80 ? "Ходячий Сімейний кодекс" : pct >= 40 ? "Уважний читач закону" : "Початківець з потенціалом";
  const line = pct >= 80 ? "Ого! Мені навіть нема що підказати." : pct >= 40 ? "Непогано! Ось де варто ще підтягнути знання." : "Нічого страшного — тепер ти знаєш значно більше, ніж до квізу.";
  return { by, ok, pct, arch, blinds, line };
}
