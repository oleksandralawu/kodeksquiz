  const copyQuiet = (text, msg) => { try { navigator.clipboard.writeText(text).then(() => toast(msg), () => {}); } catch(e) {} };
  ["facebook", "linkedin"].forEach(net => document.getElementById("sh-" + net).onclick = () => {
    track("quiz_share", { network: net, score: R.ok }); copyQuiet(shareText + " " + shareUrl(net), "Текст скопійовано — встав його в допис");
  });
  document.getElementById("sh-threads").onclick = () => track("quiz_share", { network: "threads", score: R.ok });
  /* Instagram не має веб-посилання для поширення: на телефоні відкриваємо системне меню з картинкою для сторіс, на комп'ютері — завантажуємо картинку. */
  let storyBlob = null;
  makeStoryImage(R.arch, storyLine).then(b => { storyBlob = b; }).catch(() => {});
  document.getElementById("sh-instagram").onclick = async () => {
    track("quiz_share", { network: "instagram", score: R.ok });
    if (!storyBlob) { toast("Зроби скриншот картки й додай його в сторіс"); return; }
    const file = new File([storyBlob], "kodeks-kviz-rezultat.png", { type: "image/png" });
    const mobile = window.matchMedia("(pointer: coarse)").matches;
    if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], text: shareText + " " + shareUrl("instagram") }); return; }
      catch(e) { if (e && e.name === "AbortError") return; }
    }
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(storyBlob); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("Картинку збережено — додай її в сторіс Instagram");
    } catch(e) { toast("Зроби скриншот картки й додай його в сторіс"); }
  };
  app.querySelector(".score-big").focus({preventScroll:true});
  sfx(R.pct >= 40 ? "result" : "result-soft");
  if (R.pct >= 80 && !reduceMotion) confetti();
}

/* Картинка для сторіс 1080×1920 — та сама картка, що на фіналі, намальована на canvas. Нижні ~250 px вільні: там у сторіс поле відповіді. */
async function makeStoryImage(arch, line){
  const W = 1080, H = 1920, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d"); if (!x) throw new Error("no canvas");
  try { await document.fonts.ready; } catch(e) {}
  const load = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
  const F = "Onest, system-ui, sans-serif";
  const gr = x.createLinearGradient(0, 0, W * 0.6, H); gr.addColorStop(0, "#6C4CF5"); gr.addColorStop(.55, "#8E3BD6"); gr.addColorStop(1, "#D6336C");
  x.fillStyle = gr; x.fillRect(0, 0, W, H); x.fillStyle = "#fff"; x.textBaseline = "alphabetic";
  const wrap = (text, y, size, weight, lh) => {
    x.font = `${weight} ${size}px ${F}`; const words = text.split(" "); let row = "";
    for (const w of words) { const t = row ? row + " " + w : w; if (x.measureText(t).width > W - 160 && row) { x.fillText(row, 80, y); y += size * lh; row = w; } else row = t; }
    if (row) { x.fillText(row, 80, y); y += size * lh; } return y;
  };
  x.globalAlpha = .9; x.font = `600 40px "JetBrains Mono", ${F}`; x.fillText("20 пасток Сімейного кодексу", 80, 150); x.globalAlpha = 1;
  try {
    const svg = kodyk("judge", 158).replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ');
    const im = await load("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg));
    x.drawImage(im, (W - 680) / 2, 200, 680, 680);
  } catch(e) {}
  let y = wrap(arch, 960, 92, 700, 1.12);
  wrap(line, y + 30, 54, 600, 1.3);
  x.font = `700 42px ${F}`; x.fillText("Пройди квіз:", 80, 1540); x.fillText(QUIZ_URL.replace(/^https?:\/\//, ""), 80, 1598);
  x.globalAlpha = .85; x.font = `500 32px ${F}`; x.fillText("Адвокатське бюро Олександри Стасюк", 80, 1680); x.globalAlpha = 1;
  try {
    if (typeof window.qrcode === "function") {
      const qr = qrcode(0, "M"); qr.addData(QUIZ_URL); qr.make();
      const im = await load(qr.createDataURL(8, 0)), s = 220, qx = W - 80 - s, qy = 1440;
      x.fillStyle = "#fff"; x.beginPath(); x.roundRect ? x.roundRect(qx - 16, qy - 16, s + 32, s + 32, 24) : x.rect(qx - 16, qy - 16, s + 32, s + 32); x.fill();
      x.imageSmoothingEnabled = false; x.drawImage(im, qx, qy, s, s);
    }
  } catch(e) {}
  return await new Promise((ok, no) => { try { cv.toBlob(b => b ? ok(b) : no(new Error("blob")), "image/png"); } catch(e) { no(e); } });
}

function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }

function confetti(){
  const c = document.getElementById("confetti"), x = c.getContext("2d");
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const css = getComputedStyle(document.documentElement);
  const cols = ["--gold","--accent","--gold","--good"].map(v => css.getPropertyValue(v).trim());
  const P = Array.from({length:110}, () => ({ x:Math.random()*W, y:-20-Math.random()*H*.4, vx:(Math.random()-.5)*2.4, vy:2+Math.random()*3, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6 }));
  const t0 = performance.now();
  (function f(t){ x.clearRect(0,0,W,H);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-4,-2,8,4); x.restore(); });
    if (t - t0 < 2000) requestAnimationFrame(f); else x.clearRect(0,0,W,H);
  })(t0);
}

render();
</script>
